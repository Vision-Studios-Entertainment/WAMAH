[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wamah"
version = "0.1.0"
description = "WAMAH-S[X] - Will AI Murder A Human: adversarial alignment benchmark by Vision Research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "777doc" }]
keywords = ["ai-safety", "benchmark", "red-teaming", "alignment", "wamah"]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "rich>=13", "PyYAML>=6"]

[project.scripts]
wamah = "wamah.cli:main"

[tool.setuptools.packages.find]
include = ["wamah*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
